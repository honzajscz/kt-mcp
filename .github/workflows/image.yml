# Builds the container image and publishes it to GitHub Container Registry,
# where the Azure deployment (deploy/azure) pulls it from.
#
# Every build is tagged sha-<7-char commit>, which is what deploy.sh deploys.
# Builds of the default branch are also tagged latest.
#
# The package has to be public for Azure to pull it without credentials. It is
# created private on the first push: switch it once under the package's
# Package settings → Change visibility. The image holds no secrets; those are
# passed to the container at runtime, and data/ is in .dockerignore.
name: Build image

on:
  push:
    branches: [main]
    paths:
      - src/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - Dockerfile
      - .dockerignore
      - .github/workflows/image.yml
  # Run by hand to build any branch, e.g. to deploy it before merging.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercases the image name, which the registry requires, and derives
      # the tags plus the OCI labels that link the package to this repository.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
